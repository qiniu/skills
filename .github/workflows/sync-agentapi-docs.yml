name: Sync AgentAPI skill references

on:
  schedule:
    # 09:23 China Standard Time.
    - cron: '23 1 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync-agentapi-docs
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'qiniu/skills' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: skills/agentapi/scripts/requirements.txt

      - name: Install documentation dependencies
        run: python -m pip install -r skills/agentapi/scripts/requirements.txt

      - name: Sync official documentation
        run: python skills/agentapi/scripts/sync-docs.py

      - name: Open or update the sync pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          add-paths: skills/agentapi/references/
          branch: automation/sync-agentapi-docs
          delete-branch: true
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit-message: 'docs(agentapi): sync skill references'
          title: 'docs(agentapi): sync skill references'
          body: |
            Refresh the AgentAPI skill references from the [Qiniu Developer Center](https://developer.qiniu.com/agentapi).

            The sync script regenerates the selected articles, index, and public OpenAPI attachment under `skills/agentapi/references/`.
