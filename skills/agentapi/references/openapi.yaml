  /v1/sessions/{id}/events:
    get:
      description: |-
        Claude Managed Agents-compatible paginated session event replay. Native span.model_request_end provider_request_id is the trimmed ModelLink Http_x_reqid response header for that upstream attempt, including HTTP and stream failures after a response is received; protocol body object IDs are not substituted. Native preserves reported usage fields; omitted OpenAI cache counters are used as zero only to derive uncached input. In span.model_request_end, Codex preserves its reported usage fields and turn.completed reports cumulative thread usage (including resumed executions); Claude Code result reports execution totals in model_usage and model_usage_by_model, with is_error and cache lifetimes when available. Claude partial stream cache counts are reconciled against final per-model totals. These totals do not represent individual model requests.
        New Codex Sessions project changed todo_list snapshots as complete Markdown checklists in agent.message text blocks, without tool use/result events. Explicit Codex reconnect notices are session.error events with error.retry_status.type=retrying; they preserve diagnostics without ending the turn or SSE stream. Final failures are emitted by turn finalization. Session parser policies apply to all of their turns. Missing tool completion records never produce synthetic tool results.
        New Codex final errors retain distinct failure diagnostics; only the final diagnosis determines retry classification. Parsed text redacts marked credentials consistently in live and replay paths. Arbitrary unlabelled secrets and raw sandbox stdout are outside this marker-based redaction boundary.
      parameters:
        - description: Session ID
          in: path
          name: id
          required: true
          type: string
        - description: Result limit
          in: query
          name: limit
          type: integer
        - description: Cursor event id from next_page; unknown cursors return an empty terminal page
          in: query
          name: page
          type: string
        - description: 'Sort direction: asc or desc'
          in: query
          name: order
          type: string
        - collectionFormat: csv
          description: Event type filter
          in: query
          items:
            type: string
          name: types
          type: array
        - description: Return events created after this RFC3339 timestamp
          in: query
          name: created_at[gt]
          type: string
        - description: Return events created at or after this RFC3339 timestamp
          in: query
          name: created_at[gte]
          type: string
        - description: Return events created before this RFC3339 timestamp
          in: query
          name: created_at[lt]
          type: string
        - description: Return events created at or before this RFC3339 timestamp
          in: query
          name: created_at[lte]
          type: string
        - description: Fallback form of created_at[gt] for clients/proxies that do not preserve bracketed query keys
          in: query
          name: created_at_gt
          type: string
        - description: Fallback form of created_at[gte] for clients/proxies that do not preserve bracketed query keys
          in: query
          name: created_at_gte
          type: string
        - description: Fallback form of created_at[lt] for clients/proxies that do not preserve bracketed query keys
          in: query
          name: created_at_lt
          type: string
        - description: Fallback form of created_at[lte] for clients/proxies that do not preserve bracketed query keys
          in: query
          name: created_at_lte
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/contract.SessionEventsResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
        - BearerAuth: []
        - APIKeyAuth: []
      summary: List session events
      tags:
        - sessions
    post:
      consumes:
        - application/json
      description: |-
        CLI recovery uses the same persisted retry budget as live user-message execution: confirmed retryable runtime exits (including Codex 429 retry-limit diagnostics) atomically emit retrying/rescheduled and queue the next attempt. Exhausted or unclassified runtime failures emit exhausted followed by idle/retries_exhausted and retain reusable runtime state. Outcome main-execution failures follow the live outcome policy without adding CLI retries. Recovery preparation, observation, and result-writeback failures leave the Turn running for recovery; they do not prove Session corruption or release an unconfirmed process for reuse.
        Native supports operator-configured OpenAI Responses, Chat Completions, and ModelLink Messages providers. Chat passes Agent effort through reasoning_effort or configured reasoning.effort without a model-name allowlist; reasoning budgets and boolean flags are preserved. Binding thinking switches replace inherited switches, including reasoning.enabled, while retaining unrelated reasoning fields. Thinking overrides use configured or family-default switches, with reasoning.enabled=false for unknown aliases; model-specific support is decided by the provider. Chat and Messages share private reasoning persistence for subsequent user turns and tool continuations, including same-model protocol conversion; Messages replay requires reasoning_continuation capability. Provider reasoning state is not exposed as a CMA event field. Existing histories without required provider reasoning cannot be reconstructed when migrating models or protocols.
        Claude Managed Agents-compatible session event ingress. user.message runs a normal agent turn; user.define_outcome starts an outcome loop with rubric-based grading and revision; user.interrupt cancels active session work. Native model calls retry transport/timeouts, wire/stream/protocol failures, HTTP 408/429/529/5xx, and provider failures without deterministic codes within one Session turn using runtime.native.max_provider_attempts (default and maximum 5); Retry-After-Ms/Retry-After overrides the default backoff. Structured deterministic error codes take precedence over HTTP status; other HTTP 4xx and explicit auth/invalid/context/quota/unsupported failures stop automatic attempts without backoff and emit CMA retry_status=exhausted followed by session.status_idle/retries_exhausted; queued Native inputs are canceled and the Session accepts new input. Tool input and execution failures continue as durable error tool results without replaying the provider request or tool. Native local turn-budget failures emit error.type=unknown_error followed by session.status_idle with stop_reason.type=budget_reached; the Session remains reusable and an over-limit tool fan-out is rejected before any tool executes. Other unclassified turn execution failures emit retry_status=exhausted and settle to session.status_idle/retries_exhausted; queued Native inputs are canceled and new input remains accepted. session.status_terminated is reserved for explicitly classified unrecoverable failures, including CLI prompt-too-long and a missing reusable sandbox. Exhausted Native retries emit CMA retry_status=exhausted and settle the session to session.status_idle/retries_exhausted without entering CLI session retry. For codex and claudecode, a missing reusable sandbox terminates the old session and requires creating a new session; AgentAPI does not reconstruct event history into a replacement sandbox.
        Database-backed Native recovery takes over the execution lease before continuing the same Turn from committed history. An unfinished model request is closed with a synthetic error end and a session.error with retry_status=retrying, committed together under the new lease; it does not exhaust retries or cancel queued inputs. New requests continue after the committed Turn event ordinal. Existing event payloads, timestamps, and private reasoning are preserved; interrupted response content is excluded from model history. Recovery markers have stable identities tied to the interrupted request, so another restart can resume without duplicating them. Incomplete tool results are not automatically replayed.
        Database-backed CLI Sessions remain running while reconnecting to their original sandbox after an interrupted command stream or an AgentAPI node shutdown; reconnection does not resubmit the command. An observer disconnect or a final model message alone does not complete the Turn. Completion requires a confirmed command exit and the persisted exit marker. On graceful node shutdown, the execution lease is handed off after local processing stops so another node can recover the same Turn. Node shutdown is bounded to 30 seconds; leases not handed off remain subject to expiry.
        Sandbox lifetimes are set on creation and each Connect; sandbox.default_ttl_seconds and sandbox.command_timeout_seconds default to 3600 seconds (1 hour); operators may configure longer limits when supported by the sandbox provider. There is no periodic sandbox renewal. Idle Sessions are paused by a manager every 90-150 seconds; the next Turn resumes the same sandbox. The independent command deadline actively stops tracked CLI commands, even while the sandbox is still available. Native Connects once per Turn on first sandbox use and reuses that handle within the Turn. After sandbox unavailability, safe reads and shell commands rejected before execution can resume after reconnecting; commands with uncertain outcomes are not automatically replayed and retain partial output. Only a management Connect response confirming an unrecoverable environment causes Native to create a replacement and reattach declared resources. An English tool result reports the lost working state; loss during final output collection is reported in a persisted message visible to the next model turn. CLI runtimes retain their existing missing-sandbox terminal behavior. These policies do not add request or event fields.
        Hosted native, codex and claudecode session executions include system/runtime guidance to write final downloadable files to /mnt/session/outputs/, while keeping temporary files and project edits in their working paths. This applies to ordinary and Outcome turns without requiring Agent system configuration or modifying user events. Self-hosted workers and Native executors without a sandbox backend omit this guidance; tool permissions do not gate it. Files are collected after execution and can be listed and downloaded through the Files API. CLI resume receives the current context; attaching to an already-running process does not replace its context. CLI startup commands are generated internally and pass this guidance through system instructions; user task text is unchanged. No request or response fields are added.
        Database-backed outcome Turns checkpoint the completed main execution, grader attempts and evaluation decision. Node shutdown leaves evaluation recoverable; CLI grading reconnects to its persisted invocation and saved decisions are reused. Evaluation completion, the outcome/session status and any revision Turn commit together. Accepted user.interrupt takes precedence over a racing evaluation result. Interrupted CLI graders are stopped using persisted process identities; cleanup uncertainty keeps the Turn recoverable and retries the stop before the runtime is reused. These internal checkpoints add no public event fields or statuses.
        Managed Codex Sessions use the existing Claude Code PID/PGID command lifecycle by default, with SIGINT and bounded TERM/KILL cleanup before idle or runtime reuse. No supervisor feature flag or public command-control fields are added. Lease loss and node shutdown detach observation; interruption recovery validates the lease, stops the persisted CLI and only then commits its terminal state. Cleanup uncertainty keeps the Turn cleanup-pending and lets recovery retry before releasing the runtime. A CLI exit marker alone does not confirm process-group cleanup. Recovery uses persisted Turn log paths despite changed home defaults; local execution completion stops lease renewal even if handoff fails. PID/PGID termination covers the recorded process group and relies on CLI shutdown for detached tools; it does not guarantee stopping arbitrary detached descendants or external jobs.
        Managed Native Sessions accept user.interrupt followed by user.message in one request while running. Inputs are durably queued with stable IDs and processed_at=null until applied. Interrupt stops the current model request, waits for the current tool call to finish within its deadline, emits user.interrupt then session.status_idle with stop_reason.type=end_turn, and dispatches queued messages in order. Queue state and Turn-scoped cancellation survive node changes and restart. This queue does not cover self-hosted external workers. Interruption does not roll back tool side effects.
      parameters:
        - description: Session ID
          in: path
          name: id
          required: true
          type: string
        - description: Session events
          in: body
          name: request
          required: true
          schema:
            $ref: '#/definitions/contract.SessionEventsSendRequest'
      produces:
