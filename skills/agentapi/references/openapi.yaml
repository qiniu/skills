        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
        - BearerAuth: []
        - APIKeyAuth: []
      summary: List agents
      tags:
        - agents
    post:
      consumes:
        - application/json
      description: Claude-compatible agent creation endpoint. Model may be a string or an object with id/effort. The official CMA SDK does not send AgentAPI's private runtime field; when omitted, AgentAPI uses claudecode internally.
      parameters:
        - description: Agent creation request
          in: body
          name: request
          required: true
          schema:
            $ref: '#/definitions/contract.CreateAgentRequest'
      produces:
