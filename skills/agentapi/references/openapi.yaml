info:
  contact: {}
  description: 'AgentAPI service API. /v1/* accepts a MaaS API key through x-api-key (preferred) or Authorization: Bearer; it does not accept Qiniu/QiniuAdmin signatures. auth.mode=maas resolves MaaS keys through Portal settings; auth.mode=local uses owner local and requires a request key only for model execution. /portal/* accepts only Qiniu/QiniuAdmin signatures. /admin/* accepts only the Admin session cookie. Every response includes X-Trace-ID; callers may provide X-Trace-ID to correlate request-scoped logs.'
  title: AgentAPI
  version: 0.3.0
paths:
  /health:
    get:
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/contract.HealthResponse'
      summary: Health check
      tags:
        - system
  /v1/agents:
    get:
      parameters:
        - description: Include archived agents
          in: query
