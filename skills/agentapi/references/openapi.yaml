          in: query
          name: limit
          type: integer
        - description: Opaque next_page cursor from a previous response
          in: query
          name: page
          type: string
        - description: Return agents created at or after this RFC3339 timestamp
          in: query
          name: created_at[gte]
          type: string
        - description: Return agents created at or before this RFC3339 timestamp
          in: query
          name: created_at[lte]
          type: string
      produces:
