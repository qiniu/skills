          description: Not Found
          schema:
            type: string
        "409":
          description: Conflict
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
        "502":
          description: Bad Gateway
          schema:
            type: string
        "503":
          description: Service Unavailable
          schema:
            type: string
      security:
        - BearerAuth: []
        - APIKeyAuth: []
      summary: Send session events
      tags:
